name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & package
    runs-on: ubuntu-latest
    env:
      # Telegram API credentials (masked secrets) feed BuildConfig for real login. Absent => the
      # debug placeholder (id 0) keeps CI green. They would also be REQUIRED for any future
      # release task — the credential gate in app/build.gradle.kts fails those builds.
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Compile & run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (static verification)
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Still no *publishing* step: nothing here reaches Play. The debug APK uploaded below is the
      # artifact this workflow exists to produce while the project is being tested. The
      # `release-smoke` job that compiles the R8 configuration and builds an AAB also runs on every
      # push to main (see its own note) — and its artifacts are for inspection rather than
      # distribution anyway.

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telepic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports (tests, lint & Compose stability)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telepic-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/compose-reports/
            app/build/compose-metrics/
          if-no-files-found: ignore

      # `app/schemas/` lives in the source tree, not under `build/`, so it is NOT a declared Gradle
      # task output — and a build-cache hit for `kspDebugKotlin` therefore restores nothing into it
      # and skips the export entirely. That is how the version-10 schema went missing while this job
      # still reported success and uploaded a "Room schemas" artifact containing only version 9:
      # `kspDebugKotlin FROM-CACHE` appeared in the log, and the upload step saw one file.
      #
      # Forcing an uncached re-run makes the artifact always carry the schema for the version the
      # code currently declares, which is the whole point of publishing it — the committed baseline
      # is what a hand-written future migration is checked against.
      - name: Export Room schemas (uncached)
        run: ./gradlew :app:kspDebugKotlin --no-build-cache --rerun-tasks --stacktrace

      # Turn a silent export failure into a loud one. Without this, the artifact upload below is
      # `if-no-files-found: warn`, so a run that exported nothing still goes green and the drift is
      # only noticed when someone hand-writes the next migration against a baseline that is not there.
      - name: Verify the current Room schema was exported
        run: |
          set -euo pipefail
          DB=app/src/main/java/com/telepic/data/cloud/db/TelepicDatabase.kt
          VERSION=$(grep -oE '^[[:space:]]*version[[:space:]]*=[[:space:]]*[0-9]+' "$DB" | grep -oE '[0-9]+' | head -1)
          FILE="app/schemas/com.telepic.data.cloud.db.TelepicDatabase/${VERSION}.json"
          echo "declared database version: $VERSION"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE was not exported. Room writes one schema JSON per version; it must be committed, because it is the baseline a future migration is validated against."
            ls -la app/schemas/com.telepic.data.cloud.db.TelepicDatabase/ || true
            exit 1
          fi
          echo "exported: $FILE"

      # Room exports one schema JSON per database version into app/schemas. Those files are meant to be
      # committed; this artifact is how they get out of CI without a local build.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telepic-room-schemas
          path: app/schemas/
          if-no-files-found: warn

  # R8 (minify + resource shrinking) only ever runs on a release build, and nothing used to build one
  # — so `isMinifyEnabled`/`isShrinkResources` and every rule in proguard-rules.pro were unverified,
  # including a dependency (osmdroid) that ships no consumer rules at all. This job compiles that
  # configuration *and* builds the AAB that Play actually consumes, so the release path is exercised
  # rather than assumed.
  #
  # It runs on every push to main (and on manual dispatch) as a smoke test: an R8 or ProGuard
  # regression that only surfaces at release time is exactly the failure this job exists to catch
  # early, and it runs in parallel with the build job — the cost is runner minutes, not wall clock
  # for the common case. It is skipped on pull_request runs, where the debug job already gates the
  # merge. Nothing is published: the artifacts are for inspection, and the AAB is unsigned unless
  # RELEASE_KEYSTORE_BASE64 is configured (the verify step below says so explicitly).
  release-smoke:
    name: Release build (R8 & resource shrinking)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Real credentials when the secrets exist; a non-zero placeholder otherwise, because the
      # credential gate in app/build.gradle.kts deliberately fails any release task without them.
      # Nothing here is published — the point is that R8 runs, not that the artifact is usable.
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '1' }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || 'ci-placeholder' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble release (R8 + resource shrinking)
        run: ./gradlew assembleRelease --stacktrace

      # The APK above proves R8 runs; the AAB is the artifact Play actually ingests, and it exercises a
      # different packaging path (bundle splits, resource shrinking inside a bundle). Building only the
      # APK left "release" as a compile smoke test.
      - name: Assemble release bundle (AAB)
        run: ./gradlew bundleRelease --stacktrace

      # Signing comes from RELEASE_KEYSTORE_BASE64. When it is absent the AAB is still produced but
      # unsigned, and this step says so rather than letting a green run imply a shippable artifact.
      - name: Verify the release AAB is signed
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/release/*.aab)
          echo "AAB: $AAB ($(stat -c%s "$AAB") bytes)"
          if jarsigner -verify "$AAB" 2>&1 | grep -q "jar verified"; then
            echo "::notice::release AAB signature verified"
          else
            echo "::warning::release AAB is UNSIGNED — RELEASE_KEYSTORE_BASE64 is not configured, so this run proves the bundle compiles but not that it is shippable"
          fi

      - name: Upload R8 mapping & release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telepic-release-mapping
          path: |
            app/build/outputs/mapping/release/
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Upload release AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telepic-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
