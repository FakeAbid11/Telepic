name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & package
    runs-on: ubuntu-latest
    env:
      # Telegram API credentials (masked secrets) feed BuildConfig for real login. Absent => the
      # debug placeholder (id 0) keeps CI green. They would also be REQUIRED for any future
      # release task — the credential gate in app/build.gradle.kts fails those builds.
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Compile & run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (static verification)
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Still no *shipping* release job: only debug APKs are published. The release configuration is
      # compiled by the `release-smoke` job below purely so R8 cannot rot unnoticed; its artifact is
      # never uploaded as a deliverable.

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telepic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports (tests & lint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telepic-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # R8 (minify + resource shrinking) only ever runs on a release build, and nothing used to build one
  # — so `isMinifyEnabled`/`isShrinkResources` and every rule in proguard-rules.pro were unverified,
  # including a dependency (osmdroid) that ships no consumer rules at all. This job exists purely to
  # compile that configuration. It runs in parallel with the job above so it costs no extra wall-clock.
  release-smoke:
    name: Release build (R8 & resource shrinking)
    runs-on: ubuntu-latest
    env:
      # Real credentials when the secrets exist; a non-zero placeholder otherwise, because the
      # credential gate in app/build.gradle.kts deliberately fails any release task without them.
      # Nothing here is published — the point is that R8 runs, not that the artifact is usable.
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '1' }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || 'ci-placeholder' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble release (R8 + resource shrinking)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload R8 mapping & release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telepic-release-mapping
          path: |
            app/build/outputs/mapping/release/
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
