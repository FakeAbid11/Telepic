name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_release:
        description: "Build and verify a signed release AAB (requires all release secrets)"
        type: boolean
        default: false
      build_login_apk:
        description: "Build a login-capable debug APK, encrypted before artifact upload"
        type: boolean
        default: false

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & package
    runs-on: ubuntu-latest
    # Deliberately no Telegram credentials: the downloaded debug APK must never carry a real
    # api_hash, and BuildConfig's id-0 placeholder keeps local/CI UI work usable without login.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Compile & run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (static verification)
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Still no *publishing* step: nothing here reaches Play. The debug APK uploaded below is the
      # artifact this workflow exists to produce while the project is being tested. The
      # `release-smoke` job that compiles the R8 configuration and builds an AAB also runs on every
      # push to main (see its own note) — and its artifacts are for inspection rather than
      # distribution anyway.

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telepic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports (tests, lint & Compose stability)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telepic-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/compose-reports/
            app/build/compose-metrics/
          if-no-files-found: ignore

      # `app/schemas/` lives in the source tree, not under `build/`, so it is NOT a declared Gradle
      # task output — and a build-cache hit for `kspDebugKotlin` therefore restores nothing into it
      # and skips the export entirely. That is how the version-10 schema went missing while this job
      # still reported success and uploaded a "Room schemas" artifact containing only version 9:
      # `kspDebugKotlin FROM-CACHE` appeared in the log, and the upload step saw one file.
      #
      # Forcing an uncached re-run makes the artifact always carry the schema for the version the
      # code currently declares, which is the whole point of publishing it — the committed baseline
      # is what a hand-written future migration is checked against.
      - name: Export Room schemas (uncached)
        run: ./gradlew :app:kspDebugKotlin --no-build-cache --rerun-tasks --stacktrace

      # Turn a silent export failure into a loud one. Without this, the artifact upload below is
      # `if-no-files-found: warn`, so a run that exported nothing still goes green and the drift is
      # only noticed when someone hand-writes the next migration against a baseline that is not there.
      - name: Verify the current Room schema was exported
        run: |
          set -euo pipefail
          DB=app/src/main/java/com/telepic/data/cloud/db/TelepicDatabase.kt
          VERSION=$(grep -oE '^[[:space:]]*version[[:space:]]*=[[:space:]]*[0-9]+' "$DB" | grep -oE '[0-9]+' | head -1)
          FILE="app/schemas/com.telepic.data.cloud.db.TelepicDatabase/${VERSION}.json"
          echo "declared database version: $VERSION"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE was not exported. Room writes one schema JSON per version; it must be committed, because it is the baseline a future migration is validated against."
            ls -la app/schemas/com.telepic.data.cloud.db.TelepicDatabase/ || true
            exit 1
          fi
          echo "exported: $FILE"

      # Room exports one schema JSON per database version into app/schemas. Those files are meant to be
      # committed; this artifact is how they get out of CI without a local build.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telepic-room-schemas
          path: app/schemas/
          if-no-files-found: warn

  # A login-capable debug build for the repository owner. It is manual-only and the raw APK is never
  # uploaded: the artifact is AES-encrypted with a dedicated repository secret, because this
  # repository is public and a plain artifact would expose the Telegram api_hash to everyone.
  debug-login-apk:
    name: Debug APK with Telegram login (encrypted artifact)
    if: github.event_name == 'workflow_dispatch' && inputs.build_login_apk
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ARTIFACT_PASSWORD: ${{ secrets.APK_ARTIFACT_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify login-build secrets
        run: |
          set -euo pipefail
          missing=""
          for name in TELEGRAM_API_ID TELEGRAM_API_HASH APK_ARTIFACT_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Login-capable APK is not configured; missing:$missing"
            exit 1
          fi

      - name: Assemble debug APK with real credentials
        run: ./gradlew assembleDebug --stacktrace

      - name: Encrypt APK before uploading it to public artifact storage
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$APK" \
            -out telepic-debug-login.apk.enc \
            -pass env:ARTIFACT_PASSWORD
          sha256sum telepic-debug-login.apk.enc > telepic-debug-login.apk.enc.sha256
          echo "::notice::Encrypted login APK ready. Decrypt it with the APK_ARTIFACT_PASSWORD secret."

      - name: Upload encrypted login APK
        uses: actions/upload-artifact@v4
        with:
          name: telepic-debug-login-encrypted
          path: |
            telepic-debug-login.apk.enc
            telepic-debug-login.apk.enc.sha256
          if-no-files-found: error

  # R8 (minify + resource shrinking) only ever runs on a release build. This job exercises that
  # configuration without claiming the result is shippable: it deliberately has no Telegram
  # credentials and passes the explicit unsigned-smoke property, so the artifact has a dead login and
  # no signing key. It runs on every push to main (and manual dispatch without sign_release).
  release-unsigned-smoke:
    name: Release compile smoke (unsigned, not distributable)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.sign_release)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble unsigned release APK and AAB for R8 coverage
        run: ./gradlew assembleRelease bundleRelease -Ptelepic.allowUnsignedRelease=true --stacktrace

      - name: State explicitly that the artifact is not distributable
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/release/*.aab)
          echo "AAB: $AAB ($(stat -c%s "$AAB") bytes)"
          if jarsigner -verify "$AAB" 2>&1 | grep -q "jar verified"; then
            echo "::error::The unsigned smoke job produced a signed artifact; remove the signing config from this path."
            exit 1
          fi
          echo "::notice::Unsigned compile-only AAB. It is intentionally not signed and not distributable."

      - name: Upload unsigned smoke mapping and AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telepic-unsigned-smoke
          path: |
            app/build/outputs/mapping/release/
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  # The only job that claims a release is shippable. It runs only when explicitly requested, and
  # fails before building if any credential or signing variable is missing. The resulting AAB is
  # signature-verified before it is uploaded.
  release-signed:
    name: Release build (signed & verified)
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify required release secrets
        run: |
          set -euo pipefail
          missing=""
          for name in TELEGRAM_API_ID TELEGRAM_API_HASH RELEASE_KEYSTORE_BASE64 \
                      RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Signed release is not configured; missing:$missing"
            exit 1
          fi
          echo "All release credentials and signing variables are present."

      - name: Assemble signed release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify the release AAB is genuinely signed
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/release/*.aab)
          echo "AAB: $AAB ($(stat -c%s "$AAB") bytes)"
          if ! jarsigner -verify "$AAB" 2>&1 | tee /tmp/aab-verify.txt | grep -q "jar verified"; then
            echo "::error::Release AAB is not signed; refusing to upload it as a release artifact."
            cat /tmp/aab-verify.txt
            exit 1
          fi
          echo "::notice::Release AAB signature verified."

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: telepic-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload R8 mapping and release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telepic-release-mapping
          path: |
            app/build/outputs/mapping/release/
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
