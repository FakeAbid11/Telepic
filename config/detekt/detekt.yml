# Detekt configuration for Telepic.
#
# Deliberately narrow. This tree is ~33k lines of Kotlin that predates static analysis, so a broad
# default ruleset would emit hundreds of findings; the baseline would then have to absorb almost all
# of them, which is the same as having no gate at all. The rules enabled below are the ones that
# caught real defects in review: oversized units, deep nesting, and swallowed exceptions in code that
# is supposed to honour CancellationException.
#
# Style, formatting and naming are OFF on purpose — formatting belongs to a formatter (ktlint, a
# separate mechanical change), and naming here is consistent already.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  # The four god files this exists to track: ViewerScreen.kt, MapScreen.kt, VideoViewer.kt,
  # ViewerViewModel.kt. Set at the point where a file stops being reviewable in one pass rather than
  # at detekt's default of 600.
  LongMethod:
    active: true
    threshold: 80
  LargeClass:
    active: true
    threshold: 500
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 25
    ignoreAnnotatedFunctions: ['Composable']
  NestedBlockDepth:
    active: true
    threshold: 5
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  ComplexCondition:
    active: true
    threshold: 4

exceptions:
  active: true
  # The codebase catches Throwable deliberately in background paths (documented in BackupCoordinator,
  # BackupStager, the worker and the cloud repository). What must never happen is swallowing without
  # a trace — that is what this rule catches.
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
    allowedExceptionNameRegex: '_|(ignore|expected|cancellation|try|throwable)'
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalMonitorStateException'
      - 'NullPointerException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '_|(ignore|expected|cancellation|throwable)'
  TooGenericExceptionThrown:
    active: false

# Off: no existing violations were reviewed for these, and enabling them now would only produce
# baseline noise on a tree that has no findings to learn from.
style:
  active: false
naming:
  active: false
performance:
  active: false

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: false
  RedundantSuspendModifier:
    active: false
  SleepInsteadOfDelay:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected|cancellation)'

potential-bugs:
  active: true
  LateinitUsage:
    active: false
  UnsafeCallOnNullableType:
    active: false
  # Already covered by the compiler (the tree has no `!!`), so this costs nothing but stays honest.
  UnsafeCast:
    active: true
