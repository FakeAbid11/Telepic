# Gradle JVM settings tuned for CI (GitHub Actions is the build machine).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9's built-in Kotlin rejects the `kotlin.sourceSets` DSL, and KSP still registers its generated
# sources that way (build/generated/ksp/<variant>/kotlin), so configuration fails with:
#   "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin."
# This is the documented suppression. It should be removed once a KSP release registers its output
# through `android.sourceSets` instead.
android.disallowKotlinSourceSets=false

# Kotlin
kotlin.code.style=official
