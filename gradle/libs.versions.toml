[versions]
# AGP 9.4.1 is the minimum AGP that supports compileSdk 36 (targetSdk 36 is required by Google Play
# for new submissions since 2026-08-31). It requires Gradle 9.6.0+ and JDK 17.
agp = "9.4.1"
# AGP 9 compiles Kotlin itself (built-in Kotlin) and no longer accepts the
# `org.jetbrains.kotlin.android` plugin. This version only pins the Compose compiler plugin, which
# must match the Kotlin version AGP 9.4.1 bundles (2.2.10) — it is not free to drift.
kotlin = "2.2.10"
# core is held at its newest compileSdk-36 line: androidx.core 1.19 declares minCompileSdk=37
# and fails checkAarMetadata. lifecycle/activity/navigation/paging are held at the Compose BOM
# 2024.10.01 era: their newer lines declare compose ui/runtime 1.9-1.10 as real dependencies,
# which resolves past the frozen BOM and breaks the compiled-vs-runtime FlowRow ABI in tests.
coreKtx = "1.18.0"
lifecycle = "2.8.6"
activityCompose = "1.9.3"
# App-lock device-credential prompt. 1.1.0 is the current stable line (1.2.x is still alpha) and is
# the first to expose BiometricManager.Authenticators.DEVICE_CREDENTIAL on API 26+.
biometric = "1.1.0"
composeBom = "2024.10.01"
navigationCompose = "2.8.3"
datastore = "1.2.1"
junit = "4.13.2"
coroutines = "1.11.0"
robolectric = "4.17"
androidxTest = "1.7.0"
paging = "3.3.2"
coil = "2.7.0"
media3 = "1.4.1"
tdlib = "0.1.1"
# MapLibre Native, OpenGL ES flavour. Since 13.0.0 the plain `org.maplibre.gl:android-sdk` artifact
# is Vulkan-only — its AAR manifest declares `android.hardware.vulkan.version required="true"`, which
# would drop every device without Vulkan. `android-sdk-opengl` is the same release built on GLES and
# is the one that runs everywhere minSdk 26 reaches. Do not "upgrade" the artifact name.
# 13.7.1 is the last normal-semver release; `2026.10.19-globe` is the globe-renderer variant.
maplibre = "13.7.1"
exifinterface = "1.4.2"
# Must match the KSP that AGP 9.4.1 brings in (2.2.10-2.0.2); a different version would be resolved
# to one of the two and could disagree with the Kotlin AGP compiles with.
ksp = "2.2.10-2.0.2"
room = "2.8.5"
work = "2.12.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }
coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coil" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
tdlib-android = { group = "io.github.tdlib-android", name = "core", version.ref = "tdlib" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
maplibre-android = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibre" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Deliberately no `org.jetbrains.kotlin.android`: AGP 9 provides built-in Kotlin and fails the build
# if that plugin is applied ("no longer required for Kotlin support since AGP 9.0").
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
