<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320"
     font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EC8F2"/>
      <stop offset="1" stop-color="#C9E9FF"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB35C"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <clipPath id="clipA"><rect x="852" y="36" width="116" height="116" rx="16"/></clipPath>
    <clipPath id="clipD"><rect x="984" y="168" width="116" height="116" rx="16"/></clipPath>
  </defs>

  <!-- Background panel: dark so the banner reads on both GitHub themes -->
  <rect x="0" y="0" width="1200" height="320" rx="28" fill="#0B1220"/>
  <circle cx="1160" cy="30" r="170" fill="#10233F" opacity="0.55"/>
  <circle cx="870" cy="310" r="130" fill="#0E2A4A" opacity="0.45"/>

  <!-- Wordmark column -->
  <rect x="64" y="80" width="8" height="160" rx="4" fill="#2AABEE"/>
  <text x="96" y="152" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Telepic</text>
  <text x="98" y="196" font-size="22" fill="#9DB4CE">Local-first photo library with Telegram-powered cloud backup</text>
  <text x="98" y="242" font-size="19" fill="#5B7BA6">Timeline &#183; Viewer &#183; Albums &#183; Map &#183; Cloud backup</text>

  <!-- Media tile grid: photo, video, GIF, sunset -->
  <rect x="852" y="36" width="116" height="116" rx="16" fill="#16233A"/>
  <g clip-path="url(#clipA)">
    <rect x="852" y="36" width="116" height="116" fill="url(#sky)"/>
    <circle cx="946" cy="66" r="11" fill="#FFE066"/>
    <polygon points="852,152 892,92 924,128 944,108 968,136 968,152" fill="#2F6F9E"/>
    <polygon points="852,152 876,116 906,152" fill="#245C8A"/>
  </g>

  <rect x="984" y="36" width="116" height="116" rx="16" fill="#16233A"/>
  <circle cx="1042" cy="94" r="30" fill="#2AABEE"/>
  <polygon points="1034,79 1034,109 1059,94" fill="#FFFFFF"/>

  <rect x="852" y="168" width="116" height="116" rx="16" fill="#1C2B45"/>
  <rect x="866" y="190" width="88" height="72" rx="10" fill="none" stroke="#2AABEE" stroke-width="3"/>
  <text x="910" y="238" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">GIF</text>

  <g clip-path="url(#clipD)">
    <rect x="984" y="168" width="116" height="116" fill="url(#sunset)"/>
    <circle cx="1042" cy="212" r="18" fill="#FFE066" opacity="0.95"/>
    <rect x="984" y="242" width="116" height="42" fill="#1B3A5C" opacity="0.85"/>
    <rect x="998" y="252" width="40" height="4" rx="2" fill="#FFB35C" opacity="0.6"/>
    <rect x="1032" y="264" width="56" height="4" rx="2" fill="#FFB35C" opacity="0.4"/>
  </g>

  <!-- Telegram upload badge over the grid centre -->
  <circle cx="976" cy="160" r="40" fill="#0B1220"/>
  <circle cx="976" cy="160" r="34" fill="#2AABEE"/>
  <g fill="#FFFFFF">
    <circle cx="967" cy="156" r="9"/>
    <circle cx="977" cy="149" r="12"/>
    <circle cx="988" cy="155" r="8"/>
    <rect x="960" y="155" width="36" height="10" rx="5"/>
    <polygon points="976,174 970,182 974,182 974,187 978,187 978,182 982,182"/>
  </g>
</svg>
